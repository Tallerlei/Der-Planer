<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Der Planer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: #16213e;
      padding: 1rem 2rem;
      text-align: center;
      border-bottom: 2px solid #0f3460;
    }

    header h1 {
      font-size: 2rem;
      color: #e94560;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.9rem;
      color: #a8a8b3;
      margin-top: 0.25rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      width: 100%;
      max-width: 900px;
    }

    #game-container {
      width: 100%;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
    }

    #game-container h2 {
      color: #e94560;
      margin-bottom: 1rem;
    }

    #game-container p {
      color: #a8a8b3;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #c73652;
    }

    footer {
      width: 100%;
      text-align: center;
      padding: 1rem;
      color: #a8a8b3;
      font-size: 0.8rem;
      border-top: 1px solid #0f3460;
    }
  </style>
</head>
<body>
  <header>
    <h1>Der Planer</h1>
    <p>Das alte Spiel in neuem Gewand</p>
  </header>

  <main>
    <div id="game-container">
      <h2>Willkommen bei Der Planer</h2>
      <p>
        Das Spiel befindet sich gerade im Aufbau. Schau bald wieder vorbei!
      </p>
      <button class="btn" onclick="startGame()">Spiel starten</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Der Planer</p>
  </footer>

  <script>
    function startGame() {
      const container = document.getElementById('game-container');
      container.innerHTML = `
        <h2>Spiel gestartet!</h2>
        <p>Hier entsteht bald das eigentliche Spiel. Bleib gespannt!</p>
        <button class="btn" onclick="location.reload()">Zurück zum Menü</button>
      `;
    }
  </script>
</body>
</html>
